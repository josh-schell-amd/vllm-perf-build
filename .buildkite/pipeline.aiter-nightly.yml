# AITER nightly: rebuild AITER (from main by default) on top of the latest
# published vLLM ROCm nightly, push the result, and kick off perf-eval.
#
# This is the lightweight cousin of pipeline.yml's BUILD_BASE path. Instead of
# recompiling the whole ROCm base to swap AITER (~10h), it overlays a fresh
# AITER onto the prebuilt nightly image (~1-2h). With no environment variables
# set it resolves the newest vllm/vllm-openai-rocm:nightly-<sha> and AITER main
# on its own.
#
# This flow is NOT a separate Buildkite pipeline. The main pipeline.yml is a
# dispatcher: triggering the existing vllm-perf-build pipeline with
# FLOW=aiter-nightly uploads this file instead of the vLLM-from-source build.
# So a manual test is just a New Build with FLOW=aiter-nightly, and a nightly
# is a Schedule (`0 7 * * *`) whose env sets FLOW=aiter-nightly (plus
# TRIGGER_PERF_EVAL=true to fan out to perf-eval).
#
# perf-eval reads VLLM_IMAGE and uses its own default workloads, so no
# PERF_EVAL_WORKLOADS is needed.
#
# Common overrides (set on the build / schedule): VLLM_COMMIT, AITER_BRANCH,
# AITER_COMMIT, AITER_REPO, IMAGE_TAG, PUSH_IMAGE, TRIGGER_PERF_EVAL,
# PERF_EVAL_BRANCH, PERF_EVAL_WORKLOADS, PERF_EVAL_FANOUT. See README.md.
#
# NB: because pipeline.yml uploads this file as a *nested* pipeline, top-level
# `agents`/`env` blocks don't reliably propagate to these steps on this agent
# version (see the note in pipeline.yml). So every step sets its own `agents`,
# and the flow-specific env defaults are set per-step rather than only here.

agents:
  queue: amd-cpu

steps:
  - label: ":mag: Resolve nightly + AITER"
    key: "resolve-nightly"
    command: ".buildkite/scripts/resolve_nightly.sh"
    agents:
      queue: amd-cpu
    timeout_in_minutes: 10

  - label: ":docker: Build & push AITER overlay"
    key: "overlay"
    depends_on: "resolve-nightly"
    command: ".buildkite/scripts/build_aiter_overlay.sh"
    agents:
      queue: amd-cpu
    env:
      DOCKERHUB_USER: "${DOCKERHUB_USER:-jpvillam}"
    # Pulling the nightly + an AITER kernel compile (PREBUILD_KERNELS=1). The
    # kernel prebuild can be very slow, so allow up to 8h.
    timeout_in_minutes: 480
    retry:
      automatic:
        - exit_status: -1  # agent lost
          limit: 2
        - exit_status: 255 # agent forced shutdown
          limit: 2

  - label: ":chart_with_upwards_trend: Trigger perf-eval"
    # Distinct from pipeline.yml's "perf-eval" key: a skipped (if:false) step in
    # the initial upload still reserves its key, so a nested step reusing it is
    # rejected as a duplicate.
    key: "aiter-perf-eval"
    depends_on: "overlay"
    command: ".buildkite/scripts/trigger_perf_eval.sh"
    agents:
      queue: amd-cpu
    env:
      # perf-eval's nightly-dashboard migration lives on this branch, so this
      # flow triggers it there rather than main. ${VAR:-default} keeps it
      # overridable from the build/schedule.
      PERF_EVAL_BRANCH: "${PERF_EVAL_BRANCH:-micah/migrate-vllm-dashboard-nightly}"
    timeout_in_minutes: 10
